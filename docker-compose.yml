services:
  microcontroller-elearning:
    build: .
    image: en-132-004-microcontroller-elearning:latest
    container_name: en-132-004-microcontroller-elearning
    ports:
      - "8060:3000"
    restart: unless-stopped
    volumes:
      - visitor-stats:/app/data   # เก็บสถิติการเข้าใช้ถาวร ไม่หายเมื่อ build ใหม่

volumes:
  visitor-stats:
